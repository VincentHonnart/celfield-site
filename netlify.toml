# Site vitrine celfield.com — depot distinct du CRM.
# Le CRM publie la racine de son depot sur les cinq sites clients : le site
# vitrine n'y a pas sa place. Ici, seul `public/` est publie.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Images et feuille de style : mises en cache une semaine. La CSS porte un
# numéro de version (?v=) qui change à chaque modification.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
